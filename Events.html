    #calendar {

  </style>
</head>

<body>


<nav class="navbar navbar-expand-lg navbar-dark custom-navbar">
  <div class="container">
    <a class="navbar-brand" href="index.html">Orlando Progressives</a>

<h1>Community Events Calendar</h1>


<div id="calendar"></div>


<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const calendarEl = document.getElementById('calendar');

    const calendar = new FullCalendar.Calendar(calendarEl, {
      initialView: 'dayGridMonth',

      events: [
        {
          title: 'Orlando DSA Meeting',
          start: '2026-05-03',
          url: 'https://orlando.chapters.dsausa.org/calendar/'
        },
        {
          title: 'HRC Community Event',
          start: '2026-05-07',
          url: 'https://orlando.hrc.org/events'
        },
        {
          title: 'Equality Florida Rally',
          start: '2026-05-12',
          url: 'https://www.eqfl.org/Upcoming_Events'
        },
        {
          title: 'ACLU FL Voting Rights Workshop',
          start: '2026-05-18',
          url: 'https://www.aclufl.org/how-to-take-action/'
        },
        {
          title: 'Palestine Solidarity Event',
          start: '2026-05-22',
          url: 'https://floridapalestinenetwork.org/events.html'
        }
      ],

      eventClick: function(info) {
        info.jsEvent.preventDefault();
        window.open(info.event.url, "_blank");
      }
    });

    calendar.render();
  });
</script>

</body>
</html>
