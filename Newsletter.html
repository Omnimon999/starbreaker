<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Join Our Newsletter | Orlando Progressives</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      font-family: "Noto Serif Display", serif;
    }

    h1 {
      font-family: "Stack Sans Text", sans-serif;
    }

    .custom-navbar {
      background-color: #255bad;
    }

    .signup-box {
      max-width: 500px;
      margin: 60px auto;
      padding: 30px;
      background: #255bad;
      color: white;
      border-radius: 12px;
    }

    .form-control {
      margin-bottom: 15px;
    }
  </style>
</head>

<body>


<nav class="navbar navbar-expand-lg navbar-dark custom-navbar">
  <div class="container">
    <a class="navbar-brand" href="index.html">Orlando Progressives</a>

    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="Organizations.html">Organizations</a></li>
        <li class="nav-item"><a class="nav-link" href="Events.html">Events</a></li>
        <li class="nav-item"><a class="nav-link active" href="Newsletter.html">Get Involved</a></li>
      </ul>
    </div>
  </div>
</nav>


<div class="signup-box text-center">
  <h1>Stay Connected</h1>
  <p>Join our newsletter to get updates on events, organizations, and ways to take action in Central Florida.</p>

  <form id="newsletterForm">
    <input type="text" class="form-control" placeholder="Full Name" required>
    <input type="email" class="form-control" placeholder="Email Address" required>
    
    <button type="submit" class="btn btn-light w-100">Subscribe</button>
  </form>

  <p id="successMessage" class="mt-3" style="display:none;">
    ✅ Thanks for subscribing!
  </p>
</div>


<script>
  const form = document.getElementById('newsletterForm');
  const success = document.getElementById('successMessage');

  form.addEventListener('submit', function(e) {
    e.preventDefault();

  
    form.reset();
    success.style.display = 'block';
  });
</script>

</body>
</html>
